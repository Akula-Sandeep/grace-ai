name: Agent quality evaluation

# The live, judge-graded evaluation (Backend/app/evals/live_agent.py): every scenario in
# live_scenarios.json against the real Groq, TMDB and Gemini, graded by a model judge.
# Manual only: one run spends a large share of a free-tier daily quota.
on:
  workflow_dispatch:
    inputs:
      only:
        description: "Scenario ids or prefixes, comma-separated (empty runs all)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  live-agent-eval:
    name: Live agent evaluation (model-graded)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: movie_agent
          POSTGRES_USER: movie_agent
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U movie_agent -d movie_agent"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    defaults:
      run:
        working-directory: Backend
    env:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+psycopg://movie_agent:ci-only-password@localhost:5432/movie_agent
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Backend/requirements-runtime.lock
      - name: Check live evaluation credentials
        shell: bash
        run: |
          if [[ -z "$GROQ_API_KEY" || -z "$TMDB_API_KEY" || -z "$GEMINI_API_KEY" ]]; then
            echo "Configure the GROQ_API_KEY, TMDB_API_KEY and GEMINI_API_KEY repository secrets first." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - name: Install backend dependencies
        run: python -m pip install --require-hashes -r requirements-runtime.lock -r requirements-embeddings.lock
      - name: Apply database migrations
        run: alembic upgrade head
      - name: Run the live evaluation
        env:
          ONLY: ${{ inputs.only }}
        shell: bash
        run: |
          args=(--out eval-out)
          if [[ -n "$ONLY" ]]; then args+=(--only "$ONLY"); fi
          python -m app.evals.live_agent "${args[@]}"
      - name: Publish the report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: live-agent-eval-${{ github.run_id }}
          path: Backend/eval-out/
          if-no-files-found: warn
