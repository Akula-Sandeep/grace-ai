name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (format, lint, types, tests, audit)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: movie_agent
          POSTGRES_USER: movie_agent
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U movie_agent -d movie_agent"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    defaults:
      run:
        working-directory: Backend
    env:
      ENVIRONMENT: development
      RUN_POSTGRES_CONTAINER_TESTS: "1"
      DATABASE_URL: postgresql+psycopg://movie_agent:ci-only-password@localhost:5432/movie_agent
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Backend/requirements-dev.lock
      - name: Install locked development dependencies
        run: python -m pip install --require-hashes -r requirements-dev.lock
      - name: Check formatting (Black)
        run: black --check . && black --check --line-length 110 --target-version py312 ../scripts
      - name: Lint (Ruff)
        run: ruff check . ../scripts
      - name: Prevent broad exception debt from growing
        run: python scripts/check_ble001_baseline.py
      - name: Type-check against the recorded baseline
        run: python scripts/check_mypy_baseline.py
      - name: Bandit security scan
        run: bandit -q -r app -ll
      - name: Validate operations shell scripts
        run: bash -n ../ops/backup/backup-postgres.sh ../ops/backup/restore-drill.sh ../ops/prometheus/write-metrics-token.sh
      - name: Audit runtime dependencies
        run: pip-audit -r requirements-runtime.lock --desc
      - name: Fail on tracked local artifacts
        run: python scripts/check_repo_hygiene.py
      - name: Fail on application modules no runtime entry point reaches
        run: python scripts/check_module_reachability.py
      - name: Run unit and PostgreSQL integration tests with branch coverage
        run: pytest -q --cov=app --cov-branch --cov-report=xml:coverage.xml
      - name: Upload backend coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: backend-coverage
          path: Backend/coverage.xml
          if-no-files-found: ignore

  migrations:
    name: PostgreSQL migration paths
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: movie_agent
          POSTGRES_USER: movie_agent
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U movie_agent -d movie_agent"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    defaults:
      run:
        working-directory: Backend
    env:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+psycopg://movie_agent:ci-only-password@localhost:5432/movie_agent
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Backend/requirements-dev.lock
      - name: Install locked development dependencies
        run: python -m pip install --require-hashes -r requirements-dev.lock
      - name: Verify empty, previous-release, and downgrade paths
        run: python scripts/verify_migrations.py --yes-destroy-schema

  security:
    name: Secret and SAST scans
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Reject provider keys and non-placeholder example secrets
        run: python scripts/check_no_secrets.py
      - name: Scan with Semgrep
        run: |
          python -m pip install --require-hashes -r Backend/requirements-semgrep.lock
          semgrep scan --config p/default --error --metrics=off .

  release-artifact:
    name: Clean source release artifact
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Build and validate release artifact
        run: python scripts/build_release_artifact.py --output /tmp/grace-source.tar.gz
      - name: Upload clean source artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: grace-source-release
          path: /tmp/grace-source.tar.gz
          if-no-files-found: error

  container-scan:
    name: Container image vulnerability scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - name: Build backend image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: Backend
          tags: local/grace-backend:ci
          load: true
      - name: Scan backend image
        uses: aquasecurity/trivy-action@915b19bbe73b92a6cf82a1bc12b087c9a19a5fe2 # v0.28.0
        with:
          image-ref: local/grace-backend:ci
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - name: Build frontend image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: Frontend
          tags: local/grace-frontend:ci
          build-args: |
            VITE_API_URL=/api
          load: true
      - name: Scan frontend image
        uses: aquasecurity/trivy-action@915b19bbe73b92a6cf82a1bc12b087c9a19a5fe2 # v0.28.0
        with:
          image-ref: local/grace-frontend:ci
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  sbom:
    name: Generate and upload source SBOM
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Generate SBOM
        uses: anchore/sbom-action@55dc4ee22412511ee8c3142cbea40418e6cec693 # v0.17.8
        with:
          path: .
          format: cyclonedx-json
          artifact-name: source-sbom

  production-smoke:
    name: Production Compose smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Create ephemeral production configuration
        run: |
          cat > .env <<'EOF'
          POSTGRES_PASSWORD=ci-postgres-password
          REDIS_PASSWORD=ci-redis-password
          JWT_SECRET=ci-jwt-secret-not-for-production-1234567890
          JWT_SIGNING_KEY=ci-jwt-signing-key-not-for-production-1234567890
          OTP_PEPPER=ci-otp-pepper-not-for-production-1234567890
          CSRF_KEY=ci-csrf-key-not-for-production-1234567890
          METRICS_SALT=ci-metrics-salt-not-for-production-1234567890
          METRICS_BEARER_TOKEN=ci-metrics-bearer-not-for-production-1234567890
          METRICS_USER_SALT=ci-metrics-salt-separate-from-jwt-1234567890
          CORS_ORIGINS=http://localhost
          CORS_ORIGIN_REGEX=
          REDIS_URL=redis://:ci-redis-password@redis:6379/0
          TMDB_API_KEY=ci-placeholder
          GROQ_API_KEY=ci-placeholder
          GEMINI_API_KEY=ci-placeholder
          SMTP_USER=ci@example.invalid
          SMTP_EMAIL=ci@example.invalid
          SMTP_PASSWORD=ci-placeholder
          EOF
      - name: Boot production Compose stack
        run: docker compose up --build --detach
      - name: Verify readiness and same-origin frontend
        run: |
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1/api/v1/ready >/dev/null; then
              docker compose exec --no-TTY frontend nginx -t
              curl --fail --silent http://127.0.0.1/ >/dev/null
              exit 0
            fi
            sleep 5
          done
          docker compose ps
          docker compose logs --no-color backend frontend
          exit 1
      - name: Tear down smoke stack
        if: always()
        run: docker compose down --volumes --remove-orphans

  frontend:
    name: Frontend (lint + tests + a11y + build)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: Frontend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: Frontend/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Backend/requirements-runtime.lock
      - name: Install locked API runtime dependencies
        run: python -m pip install --require-hashes -r ../Backend/requirements-runtime.lock
      - name: Install JavaScript dependencies
        run: npm ci
      - name: Run frontend runtime boundary contracts
        run: node ../scripts/verify_frontend_runtime_contracts.cjs
      - name: Lint
        run: npm run lint
      - name: Check translation catalogs (reviewed locales must be complete)
        run: npm run i18n:coverage
      - name: Run component and hook tests with coverage
        run: npx vitest run --coverage
      - name: Audit JavaScript dependencies
        run: npm audit --audit-level=high
      - name: Regenerate and type-check OpenAPI declarations
        run: npm run typecheck:api
      - name: Require generated API artifacts to be current
        run: git diff --exit-code -- ../Backend/openapi.json src/generated/api-schema.ts
      - name: Build
        env:
          VITE_SENTRY_RELEASE: grace@5.1.0
        run: npm run build
      - name: Detect Sentry source-map upload configuration
        id: sentry_release
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
        run: |
          if [[ -n "$SENTRY_AUTH_TOKEN" && -n "$SENTRY_ORG" && -n "$SENTRY_PROJECT" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Upload frontend source maps to Sentry
        if: steps.sentry_release.outputs.enabled == 'true'
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
          SENTRY_RELEASE: grace@5.1.0
        run: |
          npm install --global @sentry/cli@3.8.0
          sentry-cli releases new "$SENTRY_RELEASE"
          sentry-cli sourcemaps inject dist
          sentry-cli sourcemaps upload --release "$SENTRY_RELEASE" --validate dist
          sentry-cli releases finalize "$SENTRY_RELEASE"
      - name: Remove frontend source maps from deploy artifact
        if: always()
        run: find dist -type f -name '*.map' -delete
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Run end-to-end and accessibility tests
        run: npm run test:e2e
      - name: Upload Playwright screenshots and traces
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-results
          path: Frontend/test-results/
          if-no-files-found: ignore
      - name: Upload frontend coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: frontend-coverage
          path: Frontend/coverage/lcov.info
          if-no-files-found: ignore

  changed-coverage:
    name: Changed-line coverage (>=90%)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install locked coverage-parser dependency
        run: python -m pip install --require-hashes -r Backend/requirements-ci.lock
      - name: Download backend coverage
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: backend-coverage
          path: coverage/backend
      - name: Download frontend coverage
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: frontend-coverage
          path: coverage/frontend
      - name: Enforce changed-line coverage and design tokens
        env:
          COVERAGE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: >-
          python scripts/check_changed_coverage.py
          --base "$COVERAGE_BASE"
          --python-report coverage/backend/coverage.xml
          --frontend-report coverage/frontend/lcov.info
