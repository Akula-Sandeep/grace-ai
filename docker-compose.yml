services:
  db:
    image: pgvector/pgvector:pg16
    user: "999:999"
    expose:
      - "5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-movie_agent}
      POSTGRES_USER: ${POSTGRES_USER:-movie_agent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - movie_agent_data:/var/lib/postgresql/data
      - ./init-db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  redis:
    image: redis:7-alpine
    user: "999:999"
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}"]
    expose:
      - "6379"
    volumes:
      - movie_agent_redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  db-bootstrap:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-movie_agent}
      POSTGRES_ADMIN_USER: ${POSTGRES_USER:-movie_agent}
      POSTGRES_ADMIN_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in .env}
      MIGRATOR_DB_PASSWORD: ${MIGRATOR_DB_PASSWORD:?Set MIGRATOR_DB_PASSWORD in .env}
    command: >
      sh -c "PGPASSWORD=\"$${POSTGRES_ADMIN_PASSWORD}\" psql -h db -U $${POSTGRES_ADMIN_USER} -d $${POSTGRES_DB} -v POSTGRES_DB=\"$${POSTGRES_DB}\" -v APP_DB_PASSWORD=\"$${APP_DB_PASSWORD}\" -v MIGRATOR_DB_PASSWORD=\"$${MIGRATOR_DB_PASSWORD}\" -f /bootstrap/bootstrap-roles.sql"
    volumes:
      - ./ops/db/bootstrap-roles.sql:/bootstrap/bootstrap-roles.sql:ro
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  db-migrate:
    build: ./Backend
    user: "1000:1000"
    env_file:
      - .env
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+psycopg://${MIGRATOR_DB_USER:-grace_migrator}:${MIGRATOR_DB_PASSWORD}@db:5432/${POSTGRES_DB:-movie_agent}
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
      db-bootstrap:
        condition: service_completed_successfully
    restart: "no"

  backend:
    build:
      context: ./Backend
      args:
        INSTALL_EMBEDDINGS: "false"
    user: "1000:1000"
    env_file:
      - .env
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      APP_DB_USER: ${APP_DB_USER:-grace_app}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in .env}
      DATABASE_URL: postgresql+psycopg://${APP_DB_USER:-grace_app}:${APP_DB_PASSWORD}@db:5432/${POSTGRES_DB:-movie_agent}
      REDIS_URL: ${REDIS_URL:-redis://:${REDIS_PASSWORD}@redis:6379/0}
      TMDB_API_KEY: ${TMDB_API_KEY:-}
      OMDB_API_KEY: ${OMDB_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-20b}
      GROQ_DEEP_MODEL: ${GROQ_DEEP_MODEL:-openai/gpt-oss-120b}
      GROQ_VISION_MODEL: ${GROQ_VISION_MODEL:-qwen/qwen3.8-27b}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8-flash}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:-}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      OTP_PEPPER: ${OTP_PEPPER:?Set OTP_PEPPER in .env}
      CSRF_KEY: ${CSRF_KEY:?Set CSRF_KEY in .env}
      METRICS_SALT: ${METRICS_SALT:?Set METRICS_SALT in .env}
      METRICS_BEARER_TOKEN: ${METRICS_BEARER_TOKEN:?Set METRICS_BEARER_TOKEN in .env}
      OTP_EXPIRE_MINUTES: ${OTP_EXPIRE_MINUTES:-5}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_EMAIL: ${SMTP_EMAIL:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      CORS_ORIGINS: ${CORS_ORIGINS:?Set CORS_ORIGINS in .env}
      PROMETHEUS_MULTIPROC_DIR: /tmp/prometheus
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-172.16.0.0/12,127.0.0.1,::1}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-5}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-5}
      DB_WORKER_COUNT: ${WEB_CONCURRENCY:-2}
      DB_REPLICA_COUNT: ${DB_REPLICA_COUNT:-1}
      DB_CONNECTION_BUDGET: ${DB_CONNECTION_BUDGET:-20}
    command: ["sh", "-c", "mkdir -p /tmp/prometheus && rm -f /tmp/prometheus/* && exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers ${WEB_CONCURRENCY:-2} --proxy-headers --forwarded-allow-ips=\"$${FORWARDED_ALLOW_IPS}\" --no-server-header"]
    depends_on:
      db-bootstrap:
        condition: service_completed_successfully
      db-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:8000/api/v1/ready\")'"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  feedback-worker:
    build:
      context: ./Backend
      args:
        INSTALL_EMBEDDINGS: "false"
    user: "1000:1000"
    env_file:
      - .env
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DATABASE_URL: postgresql+psycopg://${APP_DB_USER:-grace_app}:${APP_DB_PASSWORD}@db:5432/${POSTGRES_DB:-movie_agent}
      REDIS_URL: ${REDIS_URL:-redis://:${REDIS_PASSWORD}@redis:6379/0}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:-}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      OTP_PEPPER: ${OTP_PEPPER:?Set OTP_PEPPER in .env}
      CSRF_KEY: ${CSRF_KEY:?Set CSRF_KEY in .env}
      METRICS_SALT: ${METRICS_SALT:?Set METRICS_SALT in .env}
      METRICS_BEARER_TOKEN: ${METRICS_BEARER_TOKEN:?Set METRICS_BEARER_TOKEN in .env}
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-172.16.0.0/12,127.0.0.1,::1}
    command: ["python", "-m", "app.jobs.process_background"]
    depends_on:
      backend:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  frontend:
    build:
      context: ./Frontend
      args:
        VITE_API_URL: /api
        VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
        VITE_SENTRY_RELEASE: ${SENTRY_RELEASE:-}
    user: "101:101"
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

volumes:
  movie_agent_data:
  movie_agent_redis:
